<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="pill-nav" style="margin: 20px;">
    <div class="nav-left"><span class="logo-text">Seller Central</span></div>
    <div class="nav-right">
        <a href="/profile" class="btn-contact">Profile</a>
        <a href="/logout" class="btn-contact" style="background: rgba(255,0,0,0.1); color: red;">Logout</a>
    </div>
</nav>

<main style="padding: 50px; color: white;">
    <h1>Welcome, <span th:text="${user.username}">Seller</span></h1>

    <div style="margin: 30px 0;">
        <a href="/add-property" class="btn btn-primary">+ List New Property</a>
    </div>

    <div class="glass-card" style="padding: 20px;">
        <h3>Your Properties</h3>
        <table style="width: 100%; text-align: left; margin-top: 20px;">
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                <th>ID</th><th>Title</th><th>Price</th><th>Status</th><th>Actions</th>
            </tr>
            <tr th:each="prop : ${properties}" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                <td th:text="${prop.id}"></td>
                <td th:text="${prop.title}"></td>
                <td th:text="'Rs. ' + ${prop.price}"></td>
                <td><span class="badge blue-badge" th:text="${prop.status}"></span></td>
                <td>
                    <a th:href="@{/view-property/{id}(id=${prop.id})}" class="btn" style="padding: 5px 10px; font-size: 12px;">View</a>
                    <a th:href="@{/edit-property/{id}(id=${prop.id})}" class="btn" style="padding: 5px 10px; font-size: 12px;">Edit</a>
                    <a th:href="@{/delete-property/{id}(id=${prop.id})}"
                       class="btn"
                       style="padding: 5px 10px; font-size: 12px; background: red; color: white;"
                       onclick="return confirm('Are you sure you want to delete this listing?')">
                        Delete
                    </a>
                </td>
            </tr>
        </table>
    </div>

    <div class="glass-card" style="padding: 20px; margin-top: 40px;">
        <h3>📥 Buyer Inquiries (Inbox)</h3>

        <p th:if="${#lists.isEmpty(inquiries)}" style="margin-top: 15px; opacity: 0.7;">No new inquiries yet. Your inbox is empty!</p>

        <table th:unless="${#lists.isEmpty(inquiries)}" style="width: 100%; text-align: left; margin-top: 20px;">
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                <th>Date</th>
                <th>Property ID</th>
                <th>Buyer ID</th>
                <th>Message</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <tr th:each="inq : ${inquiries}" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                <td th:text="${inq.date}"></td>
                <td th:text="${inq.propertyId}"></td>
                <td th:text="${inq.buyerId}"></td>

                <td th:text="${#strings.abbreviate(inq.message, 50)}"></td>

                <td>
                    <span th:class="${inq.status == 'Unread'} ? 'badge purple-badge' : 'badge blue-badge'"
                          th:text="${inq.status}"></span>
                </td>
                <td>
                    <a th:if="${inq.status == 'Unread'}"
                       th:href="@{/mark-read/{id}(id=${inq.id})}"
                       class="btn"
                       style="padding: 5px 10px; font-size: 12px; background: #28a745; color: white;">Mark Read</a>
                </td>
            </tr>
        </table>
    </div>
</main>
</body>
</html>
