<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard — PropertyLanka</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Property<span>Lanka</span></a>
  <div class="nav-links">
    <a href="/"                 class="nav-link">Home</a>
    <a href="/properties"       class="nav-link">Properties</a>
    <a href="/seller-dashboard" class="nav-link active">My Dashboard</a>
  </div>
  <div class="nav-right">
    <th:block th:if="${session.loggedInUser != null}">
        <span style="font-size:13px;color:var(--txt2);"
              th:text="'Hi, ' + ${session.loggedInUser.username}"></span>
      <a href="/profile"><button class="btn-ghost">Profile</button></a>
      <a href="/logout"><button class="btn-ghost">Logout</button></a>
    </th:block>
    <label class="theme-toggle" title="Toggle light/dark mode">
      <input type="checkbox" class="theme-checkbox">
      <div class="theme-track">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </div>
      <span class="theme-thumb">🌙</span>
    </label>
  </div>
</nav>

<div class="page-section">

  <! Header row>
  <div class="section-header">
    <div>
      <div class="page-title"
           th:text="'Welcome, ' + ${user.username}">Seller Dashboard</div>
      <p class="page-subtitle">Manage your listings and buyer inquiries.</p>
    </div>
    <a href="/add-property">
      <button class="btn-primary">+ List New Property</button>
    </a>
  </div>

  < Properties table>
  <div style="background:var(--surface);border:1px solid var(--bdr);
                border-radius:var(--radius-lg);overflow:hidden;margin-bottom:32px;">

    <div style="padding:18px 24px;border-bottom:1px solid var(--bdr);
                  display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:var(--font-head);font-size:15px;font-weight:700;">
        Your Listings
      </div>
      <span style="font-size:12px;color:var(--txt2);"
            th:text="${#lists.size(properties)} + ' properties'"></span>
    </div>

    <! No listings yet >
    <div th:if="${#lists.isEmpty(properties)}"
         style="padding:48px;text-align:center;color:var(--txt2);">
      <div style="font-size:40px;margin-bottom:12px;">🏘️</div>
      <div style="font-weight:600;margin-bottom:8px;">No listings yet</div>
      <a href="/add-property">
        <button class="btn-primary" style="margin-top:8px;">List Your First Property</button>
      </a>
    </div>

    <! Listings table>
    <div th:unless="${#lists.isEmpty(properties)}" style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prop : ${properties}">
          <td th:text="${prop.id}"></td>
          <td th:text="${prop.title}"></td>
          <td th:text="'Rs. ' + ${#numbers.formatInteger(prop.price, 1, 'COMMA')}"></td>
          <td>
                <span class="status-chip"
                      th:classappend="${prop.status == 'Available'} ? 'status-available' :
                                      (${prop.status == 'Sold'} ? 'status-sold' : 'status-rented')"
                      th:text="${prop.status}"></span>
          </td>
          <td class="admin-actions">
            <a th:href="@{/view-property/{id}(id=${prop.id})}">
              <button class="admin-btn-view">View</button>
            </a>
            <a th:href="@{/edit-property/{id}(id=${prop.id})}">
              <button class="admin-btn-edit">Edit</button>
            </a>
            <a th:href="@{/delete-property/{id}(id=${prop.id})}"
               onclick="return confirm('Delete this listing permanently?')">
              <button class="admin-btn-delete">Delete</button>
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <! INQUIRIES / INBOX >
  <div style="background:var(--surface);border:1px solid var(--bdr);
                border-radius:var(--radius-lg);overflow:hidden;">

    <div style="padding:18px 24px;border-bottom:1px solid var(--bdr);
                  display:flex;align-items:center;gap:10px;">
      <div style="font-family:var(--font-head);font-size:15px;font-weight:700;">
        📥 Buyer Inquiries
      </div>
      <span th:if="${not #lists.isEmpty(inquiries)}"
            style="background:var(--pur);color:#fff;font-size:10px;font-weight:700;
                     padding:2px 8px;border-radius:20px;"
            th:text="${#lists.size(inquiries)} + ' messages'"></span>
    </div>

    <! Empty inbox >
    <div th:if="${#lists.isEmpty(inquiries)}"
         style="padding:48px;text-align:center;color:var(--txt2);">
      <div style="font-size:40px;margin-bottom:12px;">📭</div>
      <div style="font-weight:600;">No inquiries yet</div>
      <div style="font-size:13px;margin-top:6px;">
        Buyer messages will appear here.
      </div>
    </div>

    <! Inquiries table >
    <div th:unless="${#lists.isEmpty(inquiries)}" style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
        <tr>
          <th>Date</th>
          <th>Property</th>
          <th>Buyer</th>
          <th>Message</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inq : ${inquiries}">
          <td th:text="${inq.date}"></td>
          <td th:text="${inq.propertyId}"></td>
          <td th:text="${inq.buyerId}"></td>
          <td th:text="${#strings.abbreviate(inq.message, 50)}"></td>
          <td>
                <span class="status-chip"
                      th:classappend="${inq.status == 'Unread'} ? 'status-rented' : 'status-available'"
                      th:text="${inq.status}"></span>
          </td>
          <td>
            <a th:if="${inq.status == 'Unread'}"
               th:href="@{/mark-read/{id}(id=${inq.id})}">
              <button class="admin-btn-view">Mark Read</button>
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script th:src="@{/js/theme-toggle.js}"></script>
</body>
</html>
