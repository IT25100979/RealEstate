<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List a Property — PropertyLanka</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">Property<span>Lanka</span></a>
    <div class="nav-links">
      <a href="/"                 class="nav-link">Home</a>
      <a href="/properties"       class="nav-link">Properties</a>
      <a href="/seller-dashboard" class="nav-link">My Dashboard</a>
    </div>
    <div class="nav-right">
      <th:block th:if="${session.loggedInUser != null}">
        <span style="font-size:13px;color:var(--txt2);"
              th:text="'Hi, ' + ${session.loggedInUser.username}"></span>
        <a href="/logout"><button class="btn-ghost">Logout</button></a>
      </th:block>
      <label class="theme-toggle" title="Toggle light/dark mode">
        <input type="checkbox" class="theme-checkbox">
        <div class="theme-track">
          <span class="icon-moon">🌙</span>
          <span class="icon-sun">☀️</span>
        </div>
        <span class="theme-thumb">🌙</span>
      </label>
    </div>
  </nav>

  <div class="page-section" style="max-width:700px;margin:0 auto;">
    <div class="page-title">List a New Property</div>
    <p class="page-subtitle">Fill in the details below to publish your listing.</p>

    <!-- Error / success messages -->
    <div th:if="${error}"
         style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
                border-radius:8px;padding:10px 14px;margin-bottom:16px;
                font-size:13px;color:#ef4444;"
         th:text="${error}"></div>

    <div th:if="${success}"
         style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);
                border-radius:8px;padding:10px 14px;margin-bottom:16px;
                font-size:13px;color:#22c55e;"
         th:text="${success}"></div>

    <form action="/add-property" method="POST"
          style="background:var(--surface);border:1px solid var(--bdr);
                 border-radius:var(--radius-lg);padding:32px;">

      <div class="form-section-bar">Basic Info</div>

      <div class="form-group">
        <label>Property Title</label>
        <input type="text" name="title" required
               placeholder="e.g. Modern Beachfront Villa">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" required rows="4"
                  placeholder="Describe the property..."></textarea>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>Price (Rs.)</label>
          <input type="number" name="price" required min="1"
                 placeholder="e.g. 15000000">
        </div>
        <div class="form-group">
          <label>Property Type</label>
          <select name="propertyType" required>
            <option value="">Select type</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Land">Land</option>
            <option value="Commercial">Commercial</option>
          </select>
        </div>
      </div>

      <div class="form-section-bar">Location</div>

      <div class="form-group">
        <label>Full Address</label>
        <input type="text" name="address" required
               placeholder="No. 12, Galle Road, Colombo 03">
      </div>

      <div class="form-section-bar">Media</div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="text" name="image" value="default-house.jpg"
               placeholder="https://... or leave as default">
        <small style="font-size:11px;color:var(--txt3);margin-top:4px;display:block;">
          Image upload coming in a later phase — paste an image URL for now.
        </small>
      </div>

      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn-primary" style="flex:1;padding:12px;">
          Post Listing
        </button>
        <a href="/seller-dashboard" style="flex:1;">
          <button type="button" class="btn-ghost" style="width:100%;padding:12px;">
            Cancel
          </button>
        </a>
      </div>
    </form>
  </div>

  <script th:src="@{/js/theme-toggle.js}"></script>
</body>
</html>
