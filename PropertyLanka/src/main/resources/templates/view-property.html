<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${property.title} + ' | EstateSaaS'">Property Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">
<nav class="pill-nav" style="margin: 20px;">
    <div class="nav-left"><span class="logo-text">EstateSaaS</span></div>
    <div class="nav-right">
        <a href="/" class="btn-contact" style="background: rgba(255,255,255,0.1);">Back to Home</a>
    </div>
</nav>

<main style="padding: 50px; color: white; max-width: 1200px; margin: 0 auto; display: flex; gap: 40px;">

    <div style="flex: 2;">
        <img th:src="${property.image != null and property.image != '' ? property.image : 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80'}"
             alt="Property Image"
             style="width: 100%; height: 400px; object-fit: cover; border-radius: 20px; margin-bottom: 20px;">

        <span class="badge blue-badge" th:text="${property.status}" style="font-size: 1rem; padding: 8px 15px;"></span>
        <h1 th:text="${property.title}" style="margin-top: 15px; font-size: 2.5rem;">Property Title</h1>
        <p style="font-size: 1.5rem; color: var(--primary); font-weight: bold;" th:text="'Rs. ' + ${property.price}"></p>

        <div class="glass-card" style="padding: 20px; margin-top: 20px;">
            <h3>Description</h3>
            <p th:text="${property.description}" style="line-height: 1.6; opacity: 0.9; margin-top: 10px;"></p>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <div style="display: flex; justify-content: space-between;">
                <p><strong>Type:</strong> <span th:text="${property.propertyType}"></span></p>
                <p><strong>Location:</strong> <span th:text="${property.address}"></span></p>
                <p><strong>Listed On:</strong> <span th:text="${property.createdDate}"></span></p>
            </div>
        </div>
    </div>

    <div style="flex: 1;">
        <div class="glass-card" style="padding: 30px; position: sticky; top: 20px;">
            <h2>Contact Seller</h2>
            <p style="opacity: 0.8; margin-bottom: 20px; font-size: 0.9rem;">Interested in this property? Send a direct message to the owner.</p>

            <form th:if="${user != null and user.role == 'BUYER'}" action="/send-inquiry" method="post">
                <input type="hidden" name="propertyId" th:value="${property.id}">

                <label>Your Message:</label><br>
                <textarea name="message" rows="5" required placeholder="I am interested in viewing this property..." style="width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);"></textarea>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Send Message</button>
            </form>

            <div th:if="${user == null}" style="text-align: center; padding: 20px; background: rgba(255,0,0,0.1); border-radius: 10px;">
                <p>You must be logged in as a Buyer to contact the seller.</p>
                <a href="/login" class="btn btn-primary" style="margin-top: 10px; display: inline-block;">Log In</a>
            </div>

            <div th:if="${user != null and user.role != 'BUYER'}" style="text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                <p>Only registered Buyers can send property inquiries.</p>
            </div>

        </div>
    </div>

</main>
</body>
</html>
