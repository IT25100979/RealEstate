<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${property.title} + ' — PropertyLanka'">Property — PropertyLanka</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .detail-img { background: #2a2a32 !important; }
    html[data-theme="light"] .detail-img { background: #d0d0de !important; }
    html[data-theme="light"] .detail-back { background: rgba(255,255,255,0.80); color: #0c0c0e; border-color: rgba(0,0,0,0.15); }
    html[data-theme="light"] .detail-back:hover { background: rgba(255,255,255,0.95); }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Property<span>Lanka</span></a>
  <div class="nav-links">
    <a href="/"           class="nav-link">Home</a>
    <a href="/properties" class="nav-link">Properties</a>
    <a href="/search"     class="nav-link">Search</a>
  </div>
  <div class="nav-right">
    <th:block th:if="${session.loggedInUser == null}">
      <a href="/login"><button class="btn-ghost">Sign In</button></a>
      <a href="/register"><button class="btn-primary">Sign Up</button></a>
    </th:block>
    <th:block th:if="${session.loggedInUser != null}">
        <span style="font-size:13px;color:var(--txt2);"
              th:text="'Hi, ' + ${session.loggedInUser.username}"></span>
      <a href="/logout"><button class="btn-ghost">Logout</button></a>
    </th:block>
    <label class="theme-toggle" title="Toggle light/dark mode">
      <input type="checkbox" class="theme-checkbox">
      <div class="theme-track">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </div>
      <span class="theme-thumb">🌙</span>
    </label>
  </div>
</nav>

<div class="detail-layout">

  <!-- Property image -->
  <div class="detail-img"
       style="background:var(--card2) !important;border:1px solid var(--bdr);">
    <img th:if="${property.image != null and property.image != ''}"
         th:src="${property.image}"
         alt=""
         style="width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block;"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div th:unless="${property.image != null and property.image != ''}"
         style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;opacity:0.45;">
      <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span style="font-size:14px;font-family:var(--font-body);letter-spacing:0.04em;">No image available</span>
    </div>
    <div th:if="${property.image != null and property.image != ''}"
         style="display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;opacity:0.45;">
      <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span style="font-size:14px;font-family:var(--font-body);letter-spacing:0.04em;">No image available</span>
    </div>
    <a href="/properties" class="detail-back">← Back to listings</a>
  </div>

  <!-- Main content + sidebar -->
  <div style="display:flex;gap:32px;flex-wrap:wrap;">

    <!-- Left — details -->
    <div style="flex:2;min-width:280px;">
      <div class="detail-header">
        <div class="detail-title" th:text="${property.title}">Title</div>
        <div class="detail-price" th:text="'Rs. ' + ${#numbers.formatInteger(property.price, 1, 'COMMA')}">Price</div>
      </div>

      <div class="detail-loc">
        <svg viewBox="0 0 24 24" width="14" height="14"
             stroke="currentColor" fill="none" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span th:text="${property.address}">Address</span>
      </div>

      <div class="detail-tags">
        <span class="detail-tag" th:text="${property.propertyType}">Type</span>
        <span class="detail-tag status-pill"
              th:classappend="${property.status == 'Available'} ? 'status-available' :
                                (${property.status == 'Sold'} ? 'status-sold' : 'status-rented')"
              th:text="${property.status}">Status</span>
        <span class="detail-tag"
              th:if="${property.createdDate != null}"
              th:text="'Listed: ' + ${property.createdDate}"></span>
      </div>

      <div class="detail-desc" th:text="${property.description}">Description</div>
    </div>

    <!-- Right — contact sidebar -->
    <div style="flex:1;min-width:240px;">
      <div class="contact-card">
        <h3>Contact Seller</h3>

        <!-- Buyer inquiry form -->
        <form th:if="${user != null and user.role == 'BUYER'}"
              action="/send-inquiry" method="POST">
          <input type="hidden" name="propertyId" th:value="${property.id}">
          <div class="form-group">
            <label>Your Message</label>
            <textarea name="message" rows="5" required
                      placeholder="I am interested in viewing this property..."></textarea>
          </div>
          <button type="submit" class="btn-primary" style="width:100%;padding:11px;">
            Send Message
          </button>
        </form>

        <!-- Not logged in -->
        <div th:if="${user == null}"
             style="text-align:center;padding:20px;
                      background:rgba(239,68,68,.08);
                      border-radius:10px;border:1px solid rgba(239,68,68,.2);">
          <p style="font-size:13px;color:var(--txt2);margin-bottom:12px;">
            You must be logged in as a Buyer to contact the seller.
          </p>
          <a href="/login">
            <button class="btn-primary" style="width:100%;">Log In</button>
          </a>
        </div>

        <!-- Logged in but not a buyer -->
        <div th:if="${user != null and user.role != 'BUYER'}"
             style="text-align:center;padding:20px;
                      background:var(--pursoft);border:1px solid var(--purborder);
                      border-radius:10px;">
          <p style="font-size:13px;color:var(--txt2);">
            Only registered Buyers can send property inquiries.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/theme-toggle.js}"></script>
</body>
</html>
