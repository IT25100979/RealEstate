<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div style="padding: 50px; display: flex; justify-content: center;">
  <form action="/update-profile" method="post" class="glass-card" style="width: 500px; padding: 30px;">
    <h2>Edit Profile</h2>

    <div style="margin-bottom: 15px;">
      <label>Email (Cannot change):</label><br>
      <input type="email" th:value="${user.email}" readonly style="width: 100%; padding: 8px; background: #eee;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Username:</label><br>
      <input type="text" name="newUsername" th:value="${user.username}" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Phone Number:</label><br>
      <input type="text" name="newPhone" th:value="${user.phone}" required style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>

    <hr style="margin: 30px 0; border-color: rgba(255,255,255,0.1);">

    <a th:href="@{/delete-account/{id}(id=${user.id})}" style="color: red; text-align: center; display: block;">Delete My Account Permanently</a>
    <a href="/" style="text-align: center; display: block; margin-top: 15px;">Back to Home</a>
  </form>
</div>
</body>
</html>
