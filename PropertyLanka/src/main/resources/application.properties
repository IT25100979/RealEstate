# ─────────────────────────────────────────────────────────
#  PropertyLanka — Spring Boot Configuration
#  Using static HTML in templates/ folder
#  NO JSP — plain HTML served by Spring MVC
# ─────────────────────────────────────────────────────────

spring.application.name=PropertyLanka
server.port=8080

# ── Static HTML (no Thymeleaf processing needed) ──────────
# Spring Boot automatically serves files from:
#   src/main/resources/templates/   → HTML pages
#   src/main/resources/static/      → CSS, JS, images

# ── MySQL ─────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/propertylanka?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
